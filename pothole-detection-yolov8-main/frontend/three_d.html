<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>3D Visualization | RoadGuard AI</title>


    <link
        rel="stylesheet"
        href="css/style.css"
    >


    <link
        rel="stylesheet"
        href="css/3d-viewer.css"
    >

</head>


<body>


<header class="main-header">

    <div class="brand">

        <h1>
            🛣️ RoadGuard AI
        </h1>

        <p>
            Intelligent Road Infrastructure Analysis
        </p>

    </div>

</header>



<nav class="navbar">

    <a href="index.html">
        🏠 Home
    </a>

    <a href="detect.html">
        🔍 Detection
    </a>

    <a href="map.html">
        🗺 live Map
    </a>

    <a href="reports.html">
        📊 Reports
    </a>

    <a
        href="three_d.html"
        class="active"
    >
        🌐 3D Visualization
    </a>

</nav>



<main class="container">


    <section class="page-heading">

        <h2>
            3D Road Damage Visualization
        </h2>

        <p>

            Explore pothole detection
            data in an interactive
            three-dimensional environment.

        </p>

    </section>



    <!-- SUMMARY -->

    <section class="three-summary">


        <div class="summary-card">

            <span>
                Total Objects
            </span>

            <strong id="totalObjects">
                --
            </strong>

        </div>


        <div class="summary-card">

            <span>
                Potholes
            </span>

            <strong id="total3DPotholes">
                --
            </strong>

        </div>


        <div class="summary-card">

            <span>
                Critical Areas
            </span>

            <strong id="critical3D">
                --
            </strong>

        </div>


    </section>



    <!-- CONTROLS -->

    <section class="viewer-controls">


        <button
            id="reloadSceneBtn"
            class="primary-btn"
        >

            🔄 Reload Scene

        </button>


        <button
            id="resetCameraBtn"
            class="secondary-btn"
        >

            🎯 Reset View

        </button>


    </section>



    <!-- 3D VIEWER -->

    <section class="viewer-card">

        <div
            id="threeContainer"
        ></div>


        <div
            id="threeStatus"
            class="three-status"
        >

            Loading 3D scene...

        </div>


    </section>


</main>



<script src="js/config.js"></script>


<script type="module" src="js/three_d.js"></script>


</body>

</html>
